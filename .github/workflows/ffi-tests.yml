
name: FFI Cross Platform Tests

on:
  # push:
  # pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: ffi, sodium

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check Composer autoloader
        run: ls -l vendor/autoload.php

      - name: Show environment
        run: php -r "echo PHP_OS_FAMILY . PHP_EOL . php_uname('m') . PHP_EOL;"

      - name: Run Linux test
        if: matrix.os == 'ubuntu-latest'
        run: php -d ffi.enable=1 tests/OperatingSystem/Linux.php

      - name: Run Windows test
        if: matrix.os == 'windows-latest'
        run: php -d ffi.enable=1 tests/OperatingSystem/Win.php       

      - name: Run macOS test
        if: matrix.os == 'macos-latest'
        run: php -d ffi.enable=1 tests/OperatingSystem/Mac.php

      - name: Run Linux preload test
        if: matrix.os == 'ubuntu-latest'
        run: |
          php \
            -d ffi.enable=preload \
            -d ffi.preload="$GITHUB_WORKSPACE/src/Core/Component/FFI/Preload/shuffleindice.h" \
            tests/OperatingSystem/Preload.php